<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#006659">
  <title>울산과학대학교 전문대학 혁신지원사업단 퀴즈</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">

    <!-- 시작 화면 -->
    <section id="startScreen" class="screen active">
      <div style="
          background:#006659;
          border-radius:20px;
          padding:16px 24px;
          width:91%;
          margin:0 auto 24px;
          display:flex;
          justify-content:center;
          align-items:center;
      ">
        <img src="./assets/images/logo.png"
             alt="울산과학대학교 로고"
             style="display:block; width:210px; height:auto;">
      </div>

      <p class="eyebrow">2026 지산학 페스티벌</p>

      <h1>
        전문대학<br>
        혁신지원사업<br>
        <strong>퀴즈</strong>
      </h1>

      <p class="subtitle">
        혁신지원사업에 대해 알아보고 선물도 받자!
      </p>

      <div class="intro-card">
        <div>📝 퀴즈 풀기</div>
        <div>⏱️ 오프라인 게임 하기</div>
        <div>🎁 선물 획득</div>
      </div>

      <button id="startBtn" class="primary-btn">
        시작하기
      </button>

      <p class="notice">
        ※ 본 콘텐츠는 AI를 활용하여 제작되었습니다.
      </p>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="quizScreen" class="screen">
      <div class="topbar">
        <span class="badge">MISSION</span>
        <span id="progressText">1 / 3</span>
      </div>

      <div class="quiz-card">
        <div id="questionArea" class="question-area">
          <p id="questionNumber" class="question-number">Q1</p>
          <h2 id="questionText"></h2>
          <div id="options" class="options"></div>

          <!-- 정답/오답 오버레이 -->
          <div id="answerOverlay" class="answer-overlay" hidden>
            <div class="answer-popup">
              <div id="answerIcon" class="answer-icon"></div>
              <h3 id="answerTitle"></h3>
              <p id="answerText"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 퀴즈 완료 화면 -->
    <section id="quizCompleteScreen" class="screen">
      <div class="result-icon">🎉</div>
      <p class="eyebrow">QUIZ COMPLETE!</p>
      <h2>퀴즈 완료!</h2>

      <div class="score-card">
        <p id="scoreSummary">3문제 중 <strong>0문제</strong> 정답!</p>
      </div>
    </section>

  </main>

  <script src="./script.js"></script>
</body>
</html>
